<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d">
<title id="t">Pere architecture</title>
<desc id="d">Flutter client talks to a FastAPI backend over WebSocket and REST. The backend calls Whisper, Ollama and Kokoro, stores memory in Qdrant and SQLite, and runs agents with MCP tools that ask for confirmation before executing.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker></defs>
<rect width="1280" height="800" fill="#18181b"/>
<text x="60" y="84" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fafafa">Pere — local-first architecture</text><text x="60" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#a1a1aa">A personal AI assistant that runs entirely on local models</text><rect x="60" y="220" width="260" height="120" rx="14" fill="#27272a" stroke="#60a5fa" stroke-width="2"/><text x="190" y="278" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Flutter client</text><text x="190" y="308" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">voice · chat · settings</text><rect x="430" y="220" width="320" height="120" rx="14" fill="#27272a" stroke="#60a5fa" stroke-width="2"/><text x="590" y="266" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">FastAPI backend</text><text x="590" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">WebSocket voice · REST</text><text x="590" y="320" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">token auth · HTTPS</text><rect x="900" y="150" width="320" height="90" rx="14" fill="#27272a" stroke="#a78bfa" stroke-width="2"/><text x="1060" y="193" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Whisper</text><text x="1060" y="223" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">speech to text</text><rect x="900" y="290" width="320" height="90" rx="14" fill="#27272a" stroke="#a78bfa" stroke-width="2"/><text x="1060" y="333" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Ollama LLM</text><text x="1060" y="363" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">local models</text><rect x="900" y="430" width="320" height="90" rx="14" fill="#27272a" stroke="#a78bfa" stroke-width="2"/><text x="1060" y="473" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Kokoro</text><text x="1060" y="503" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">text to speech</text><rect x="430" y="470" width="150" height="100" rx="14" fill="#27272a" stroke="#34d399" stroke-width="2"/><text x="505" y="518" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Qdrant</text><text x="505" y="548" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">vector memory</text><rect x="600" y="470" width="150" height="100" rx="14" fill="#27272a" stroke="#34d399" stroke-width="2"/><text x="675" y="518" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">SQLite</text><text x="675" y="548" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">state · alarms</text><rect x="60" y="470" width="300" height="100" rx="14" fill="#27272a" stroke="#60a5fa" stroke-width="2"/><text x="210" y="518" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Agents + MCP tools</text><text x="210" y="548" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">confirm before executing</text><line x1="320" y1="280" x2="430" y2="280" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><text x="375" y="270" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa" stroke="#18181b" stroke-width="6" paint-order="stroke">audio · chat</text><line x1="750" y1="255" x2="900" y2="195" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><line x1="750" y1="285" x2="900" y2="335" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><line x1="750" y1="315" x2="900" y2="475" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><line x1="505" y1="340" x2="505" y2="470" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><line x1="675" y1="340" x2="675" y2="470" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><line x1="470" y1="340" x2="260" y2="470" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="640" width="1160" height="64" rx="12" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="3 0"/><text x="640" y="681" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#fafafa">Local only: no audio, text or memory leaves the machine</text><text x="640" y="756" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa">Docker Compose · Terraform (AWS EC2, SSM-only access) · pytest and GitHub Actions CI</text>
