<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d">
<title id="t">Parish portal security and notification flow</title>
<desc id="d">Login with rate limiting and audit log leads to permission checks, then controllers, then models that encrypt health fields. Controllers emit events that queue a job, which sends real-time and Web Push notifications.</desc>
