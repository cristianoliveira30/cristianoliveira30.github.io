ca, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Queue jobs</text><text x="1060" y="208" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">report generation</text><rect x="900" y="330" width="320" height="110" rx="14" fill="#27272a" stroke="#a78bfa" stroke-width="2"/><text x="1060" y="383" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">PDF / DOCX worker</text><text x="1060" y="413" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">Node · TypeScript · Playwright</text><rect x="470" y="520" width="310" height="110" rx="14" fill="#27272a" stroke="#34d399" stroke-width="2"/><text x="625" y="573" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">Reverb + Web Push</text><text x="625" y="603" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">real-time notifications</text><rect x="900" y="540" width="320" height="100" rx="14" fill="#27272a" stroke="#34d399" stroke-width="2"/><text x="1060" y="588" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#fafafa">PostgreSQL</text><text x="1060" y="618" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#a1a1aa">one connection per sector</text><line x1="370" y1="300" x2="470" y2="300" stroke="#71717a" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa" stroke="#18181b" stroke-width="6" paint-order="stroke">JSON</text><line x1="780" y1="260" x2="900" y2="190