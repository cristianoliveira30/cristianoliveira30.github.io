<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d">
<title id="t">Multi-client dashboard platform architecture</title>
<desc id="d">A framework-free dashboard-core in the browser calls a Laravel monolith. Laravel dispatches queue jobs that call a Node PDF worker, which calls back; Reverb and Web Push notify the browser; PostgreSQL stores data per sector.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker></defs>
<rect width="1280" height="800" fill="#18181b"/>
